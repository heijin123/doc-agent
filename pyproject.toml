[project]
name = "doc-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "openai>=3.8.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
link-mode = "copy"
