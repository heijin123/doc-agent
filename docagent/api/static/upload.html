<body data-page-node-id="1gH88PLKUJx3lGubCwJhMO">
  <!-- 顶部导航：问答页 / 上传页（当前）互相跳转 -->
  <nav class="top_nav" data-page-node-id="iJYt7nBQRgXkNQIqcK1lNC">

    <button id="clear_all_button" class="danger" data-page-node-id="kS4tny3cTiJsbTVNI5Wjik">清空列表</button>

  <main class="page_container" data-page-node-id="NesYjDh05hcwWAY646yQOp">
    <h1 class="page_title" data-page-node-id="ndXTg0d5HCHmqLzGQ4KKol">文档上传</h1>
    <p class="page_subtitle" data-page-node-id="iMokhN2MgFP8bbu4WTraU0">上传即进入后台流水线（格式探测 → 解析 → 质量门 → 切片 → 落库），多文件并发、互不阻塞。大文件会先返回预计耗时，处理中可稍后回来查看结果。</p>

    <div class="panel" data-page-node-id="f7dWtMJagMtA1IjzDZnRMA">
      <!-- 双入口：文件多选 与 文件夹（webkitdirectory，仅 Chromium 系浏览器支持） -->
      <input type="file" id="file_picker" class="hidden_file_input" multiple data-page-node-id="rqrE24uiq2ZFpbiibZSXxP" />
      <input type="file" id="folder_picker" class="hidden_file_input" webkitdirectory data-page-node-id="PcYqGJ1AHR2nmadK1NTKP4" />

      <div class="upload_actions" data-page-node-id="JyUZHPSQutfq90VrXqQgNx">
        <button id="pick_files_button" class="primary" data-page-node-id="pmMrfwBUfeJMLX38z0FqNJ">选择文件（可多选）</button>
        <button id="pick_folder_button" data-page-node-id="vrZKQd6CZ0RJB1Kbh3f1Yc">选择文件夹</button>
        <button id="start_upload_button" disabled data-page-node-id="DAArr3vvLuH7sDfCwpSZlb">开始上传</button>
        <span id="folder_support_hint" class="upload_hint" data-page-node-id="E8kGfh0Mk5TePBcShFZqyk"></span>
      </div>
      <p class="upload_hint" data-page-node-id="WECMQJsnMFLe0G5WbuBZKC">支持格式：PDF / Word / Excel / PPT / Markdown 等（解析层按格式路由）</p>

      <!-- 待传/已传文件列表：每行一个文件，含进度与状态 -->
      <div id="file_list" class="file_list" data-page-node-id="EGaf81QEyT5CbORKcf2yGL"></div>
      <div id="summary_bar" class="summary_bar" style="display:none" data-page-node-id="ibPWKQ90YCGoEQKowsnWJg"></div>
    </div>

    <!-- 最近上传记录：服务端后台任务，关页面不影响；可回来回查进度与结果 -->
    <div class="panel recent_panel">
      <div class="recent_header">
        <h2 class="recent_title">最近上传记录</h2>
        <button id="refresh_recent_button" class="secondary">刷新</button>
      </div>
      <p class="recent_hint">文件在服务端后台切片 / 入库，关掉本页也不影响；过会儿回来这里即可查看进度与结果。</p>
      <div id="recent_list" class="file_list"></div>
    </div>
  </main>

  <script>
    "use strict";
    /* ============================================================
       上传页前端逻辑
       API 契约（后端异步摄取，2026-09-09 起）：
         POST /api/v1/ingest   multipart/form-data，字段名 file
           立刻返回（不等待解析）：
             { "job_id": string, "status": "queued",
               "pages": number|null, "eta_seconds": number,
               "message": "已接收，后台处理中，预计约 N 分钟 后可查询" }
           仅落盘失败才在此返回 { "status": "failed", "error" }
         GET  /api/v1/ingest/status?job_id=xxx   轮询任务状态
           返回快照：status ∈ queued|processing|done|failed，
                     done/failed 时含 result{ pages_parsed, chunks_created, stored, skipped, format, degraded, error }
                     + eta_seconds / waited_s / remaining_s 供进度提示
       约定：上传仅做落盘，真正的解析/切片/入库在后台并发执行；
             前端轮询状态，把「处理中」翻成「已完成/失败」。
       ============================================================ */

    // 单个待传文件在内存中的状态（选择后、上传前集中管理）
    let selected_files = [];   // [{ file: File, relative_path: string, status: "pending"|"ok"|"failed", error: string|null }]

    const file_picker = document.getElementById("file_picker");
    const folder_picker = document.getElementById("folder_picker");
    const file_list_element = document.getElementById("file_list");
    const summary_element = document.getElementById("summary_bar");
    const start_button = document.getElementById("start_upload_button");

    // 浏览器不支持文件夹选择（webkitdirectory 是 Chromium 私有特性）时禁用该入口
    const supports_folder_picker = "webkitdirectory" in document.createElement("input");
    document.getElementById("folder_support_hint").textContent =
      supports_folder_picker ? "" : "（当前浏览器不支持文件夹选择，请用多选）";

    // ---- 文件选择：展示相对路径（文件夹内文件带层级），同名文件去重 ----
    function add_files_to_list(file_list_from_picker) {
      const before = selected_files.length;
      Array.from(file_list_from_picker).forEach(function (file) {
        // webkitRelativePath: "文件夹名/子路径/文件.pdf"；普通多选为空串，回退文件名
        const relative_path = file.webkitRelativePath || file.name;
        const already_selected = selected_files.some(function (entry) {
          return entry.relative_path === relative_path;
        });
        if (already_selected) return;
        selected_files.push({ file: file, relative_path: relative_path, status: "pending", error: null });
      });
      const added = selected_files.length - before;
      if (added === 0) {
        alert("所选文件已在列表中，无需重复添加");
        return;
      }
      refresh_file_list();
    }

    file_picker.addEventListener("change", function () { add_files_to_list(file_picker.files); file_picker.value = ""; });
    folder_picker.addEventListener("change", function () { add_files_to_list(folder_picker.files); folder_picker.value = ""; });
    document.getElementById("pick_files_button").addEventListener("click", function () { file_picker.click(); });
    document.getElementById("pick_folder_button").addEventListener("click", function () {
      if (supports_folder_picker) folder_picker.click();
      else alert("当前浏览器不支持文件夹选择，请改用「选择文件（可多选）」并按住 Ctrl 多选。");
    });

    // ---- 列表渲染：全量重建（文件数通常几十以内，重建开销可忽略）----
    function refresh_file_list() {
      file_list_element.innerHTML = "";
      selected_files.forEach(function (entry, index) {
        file_list_element.appendChild(build_file_row(entry, index));
      });
      update_start_button_state();
    }

    function build_file_row(entry, index) {
      const row = document.createElement("div");
      row.className = "file_row";
      row.dataset.index = index;

      const name_cell = document.createElement("div");
      name_cell.className = "file_name";
      name_cell.textContent = entry.relative_path;
      name_cell.title = entry.relative_path;

      const meta_cell = document.createElement("div");
      meta_cell.className = "file_meta";
      meta_cell.textContent = format_file_size(entry.file.size);

      const badge = document.createElement("span");
      badge.className = "status_badge " + entry.status;
      badge.textContent = status_label(entry.status);

      const progress_track = document.createElement("div");
      progress_track.className = "progress_track";
      const progress_fill = document.createElement("div");
      progress_fill.className = "progress_fill";
      progress_track.appendChild(progress_fill);

      const remove_button = document.createElement("button");
      remove_button.textContent = "移除";
      remove_button.className = "remove_button";
      // 已成功/正在上传的文件不可移除，避免中途删除造成状态错乱
      remove_button.disabled = entry.status === "ok" || entry.status === "uploading";
      remove_button.addEventListener("click", function () {
        selected_files.splice(index, 1);
        refresh_file_list();
      });

      row.appendChild(name_cell);
      row.appendChild(meta_cell);
      row.appendChild(progress_track);
      row.appendChild(badge);
      row.appendChild(remove_button);
      return row;
    }

    function format_file_size(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1024 / 1024).toFixed(1) + " MB";
    }
    function status_label(status) {
      return { pending: "待上传", queued: "排队中", uploading: "上传中", processing: "处理中", ok: "已完成", failed: "失败" }[status] || status;
    }
    function format_duration(seconds) {
      seconds = Math.max(0, Math.round(seconds || 0));
      if (seconds < 60) return seconds + " 秒";
      const m = Math.round(seconds / 60);
      return m + " 分钟";
    }

    // ---- 逐个上传：XHR 才能拿到上传进度事件（fetch 不支持）----
    // 上传仅把文件推到服务端落盘；服务端立刻返回 job_id，真正解析/切片在后台跑，
    // 拿到 job_id 后翻「处理中」并启动轮询。
    function upload_one_entry(entry, index) {
      return new Promise(function (resolve) {
        entry.status = "uploading";
        update_row_status(index);

        const form_data = new FormData();
        form_data.append("file", entry.file);

        const request = new XMLHttpRequest();
        request.open("POST", "/api/v1/ingest");

        request.upload.onprogress = function (event) {
          if (!event.lengthComputable) return;
          const percent = Math.round((event.loaded / event.total) * 100);
          update_row_progress(index, percent);
        };
        request.onload = function () {
          let body = null;
          try { body = JSON.parse(request.responseText); } catch (parse_error) { /* 响应非 JSON，按失败处理 */ }
          if (request.status >= 200 && request.status < 300 && body && body.job_id) {
            // 上传成功：进入后台处理，开始轮询
            entry.status = "processing";
            entry.job_id = body.job_id;
            entry.pages = body.pages;
            entry.eta_seconds = body.eta_seconds;
            entry.eta_message = body.message;
            update_row_status(index);
            update_row_progress(index, 0, true);  // 进度条转入不确定动画
            poll_job(entry, index);
          } else {
            entry.status = "failed";
            entry.error = (body && body.error) || ("服务返回 " + request.status);
            update_row_status(index);
          }
          resolve();
        };
        request.onerror = function () {
          entry.status = "failed";
          entry.error = "网络错误，请确认服务已启动";
          update_row_status(index);
          resolve();
        };

        request.send(form_data);
      });
    }

    // （轮询逻辑已统一收归「最近上传记录」面板，见 poll_recent_job）

    async function start_upload() {
      const pending = selected_files.filter(function (entry) { return entry.status === "pending"; });
      if (pending.length === 0) { alert("没有待上传的文件"); return; }

      start_button.disabled = true;
      // 逐个串行上传：管线单文档处理语义，也避免并发打满服务。
      // 每个文件上传完即交服务端后台处理（add_recent_job 接管跟踪），随后从待传列表移除。
      for (const entry of pending) {
        await upload_one_entry(entry, selected_files.indexOf(entry));
      }
      start_button.disabled = false;
      // 移交完成：把已提交的从待传列表移除（进度/结果在「最近上传记录」面板继续）
      selected_files = selected_files.filter(function (entry) { return !entry.submitted; });
      refresh_file_list();
      update_summary();
    }

    // ---- 行内状态/进度更新（避免整表重建打断进度条动画）----
    function update_row_status(index) {
      const row = file_list_element.querySelector('.file_row[data-index="' + index + '"]');
      if (!row) return;
      const badge = row.querySelector(".status_badge");
      const meta_cell = row.querySelector(".file_meta");
      const entry = selected_files[index];
      badge.className = "status_badge " + entry.status;
      badge.textContent = entry.status === "failed" && entry.error ? "失败" : status_label(entry.status);
      // 元信息行显示结果明细：成功 = 入库/跳过计数；处理中 = ETA 提示；失败 = 具体原因
      let meta_text = format_file_size(entry.file.size);
      if (entry.status === "ok") {
        meta_text += " · " + format_ingest_result(entry);
        meta_cell.style.color = "";
      } else if (entry.status === "processing") {
        meta_text += " · 处理中";
        if (typeof entry.remaining_s === "number") meta_text += " · 预计还需约 " + format_duration(entry.remaining_s);
        else if (entry.eta_message) meta_text += " · " + entry.eta_message;
        meta_cell.style.color = "var(--color_pending)";
      } else if (entry.status === "failed") {
        meta_text += " · " + (entry.error || "未知错误");
        meta_cell.style.color = "var(--color_failed)";
      }
      meta_cell.textContent = meta_text;
      badge.title = entry.error || "";
      const remove_button = row.querySelector(".remove_button");
      if (remove_button) remove_button.disabled = entry.status === "ok" || entry.status === "uploading" || entry.status === "processing";
    }
    function update_row_progress(index, percent, indeterminate) {
      const row = file_list_element.querySelector('.file_row[data-index="' + index + '"]');
      if (!row) return;
      const fill = row.querySelector(".progress_fill");
      if (indeterminate) { fill.classList.add("indeterminate"); return; }
      fill.classList.remove("indeterminate");
      fill.style.width = percent + "%";
    }

    // 摄取结果摘要：切片数 + 入库/跳过（幂等命中跳过不算失败）+ 格式/降级
    function format_ingest_result(entry) {
      let text = "";
      if (entry.created_chunks != null) text += "切片 " + entry.created_chunks;
      if (entry.stored != null || entry.skipped != null) {
        text += "（入库 " + (entry.stored || 0) + " · 跳过 " + (entry.skipped || 0) + "）";
      }
      if (entry.format) text += " · " + entry.format;
      if (entry.degraded) text += " · 降级";
      return text;
    }

    function update_start_button_state() {
      const has_pending = selected_files.some(function (entry) { return entry.status === "pending"; });
      start_button.disabled = !has_pending;
      update_summary();
    }

    // 汇总条：成功/失败计数 + 本次摄取规模（页数/切片数合计）
    function update_summary() {
      const done = selected_files.filter(function (entry) { return entry.status === "ok"; });
      const failed = selected_files.filter(function (entry) { return entry.status === "failed"; });
      const total_pages = done.reduce(function (sum, entry) { return sum + (entry.parsed_pages || 0); }, 0);
      const total_chunks = done.reduce(function (sum, entry) { return sum + (entry.created_chunks || 0); }, 0);

      if (selected_files.length === 0) { summary_element.style.display = "none"; return; }
      summary_element.style.display = "";
      let text = "已选 <span class='count'>" + selected_files.length + "</span> 个文件";
      if (done.length) text += " · 成功 <span class='count'>" + done.length + "</span> 个";
      if (failed.length) text += " · 失败 <span class='count'>" + failed.length + "</span> 个";
      if (done.length) text += " · 共解析 " + total_pages + " 页 / 生成 " + total_chunks + " 个切片";
      summary_element.innerHTML = text;
    }

    start_button.addEventListener("click", start_upload);
    document.getElementById("clear_all_button").addEventListener("click", function () {
      // 上传中/处理中的文件不打断（服务端仍在处理），仅清空已结束的列表项
      const removable = selected_files.filter(function (entry) { return entry.status !== "uploading" && entry.status !== "processing"; });
      selected_files = removable;
      refresh_file_list();
    });
  </script>
</body>
